<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter | CalcHub</title><meta name="description" content="Convert length, weight and temperature units."><link rel="canonical" href="https://calchub-2s2.pages.dev/unit-converter-calculator.html"><link rel="icon" href="favicon.png" type="image/png"><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#182235;margin:0}header,footer{background:#14233d;color:white;padding:18px max(5%,calc((100% - 1000px)/2))}header a,footer a{color:white}main{max-width:820px;margin:35px auto;padding:0 18px}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 8px 30px #12223b0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #aeb9ca;border-radius:9px;box-sizing:border-box;font-size:16px}button{background:#225ce3;color:white;border:0;border-radius:9px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px}button:hover{background:#1947af}.result{margin-top:20px;background:#eff6ff;border-radius:10px;padding:18px;line-height:1.8;white-space:pre-line}.note{font-size:14px;color:#566174}h1{font-size:clamp(26px,4vw,38px)}@media(max-width:480px){.panel{padding:18px}}</style></head><body><header><a href="index.html">🧮 CalcHub — All Calculators</a></header><main><article class="panel"><h1>Unit Converter</h1><p>Convert length, weight and temperature units.</p><form id="calcForm"><div class="grid"><div><label for="amount">Value</label><input id="amount" type="number" value="10" step="any" required></div><div><label for="conversion">Conversion</label><select id="conversion"><option value="km-mi">Kilometres to miles</option><option value="mi-km">Miles to kilometres</option><option value="kg-lb">Kilograms to pounds</option><option value="lb-kg">Pounds to kilograms</option><option value="cm-in">Centimetres to inches</option><option value="in-cm">Inches to centimetres</option><option value="c-f">Celsius to Fahrenheit</option><option value="f-c">Fahrenheit to Celsius</option></select></div></div><button type="submit">Calculate</button></form><div id="result" class="result" role="status" aria-live="polite">Enter your details and select Calculate.</div><p class="note">This tool provides an estimate. Verify results before making financial, educational or medical decisions.</p></article></main><footer><a href="index.html">All Calculators</a> · <a href="privacy-policy.html">Privacy Policy</a> · <a href="contact.html">Contact</a></footer><script>const val=id=>document.getElementById(id).value;const num=id=>{let v=val(id);return v.trim()===''?NaN:Number(v)};const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(n);const show=s=>document.getElementById('result').textContent=s;const error=(s='Please enter valid values.')=>show(s);const day=id=>{let v=val(id);return /^\d{4}-\d{2}-\d{2}$/.test(v)?Date.parse(v+'T00:00:00Z'):NaN};document.getElementById('calcForm').addEventListener('submit',e=>{e.preventDefault();try{if([...document.querySelectorAll('input[type=number]')].some(x=>x.value.trim()===''||!Number.isFinite(Number(x.value))))return error();let a=num('amount'),c=val('conversion'),f={'km-mi':[.621371,'mi'],'mi-km':[1.609344,'km'],'kg-lb':[2.2046226218,'lb'],'lb-kg':[.45359237,'kg'],'cm-in':[1/2.54,'in'],'in-cm':[2.54,'cm']};let v=c==='c-f'?a*9/5+32:c==='f-c'?(a-32)*5/9:a*f[c][0],u=c==='c-f'?'°F':c==='f-c'?'°C':f[c][1];show(`Converted value: ${v.toLocaleString(undefined,{maximumFractionDigits:6})} ${u}`);}catch(e){error('Unable to calculate. Check your inputs.')}});</script></body></html>
